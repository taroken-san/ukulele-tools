<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ウクレレコード帳 | S&Sシニアスマイル音楽教室</title>
<style>
  :root{
    --bg:#faf7f2; --card:#fff; --ink:#2f2a26; --sub:#8a8177;
    --line:#e4ddd2; --accent:#e07a3f; --accent2:#3f7ea0;
    --root:#e07a3f; --third:#6fae6f; --fifth:#3f7ea0; --ext:#b06fb0;
    --shadow:0 2px 10px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:16px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5;box-shadow:var(--shadow)}
  .hrow{display:flex;justify-content:space-between;align-items:baseline;max-width:1000px;margin:0 auto;flex-wrap:wrap;gap:6px}
  h1{margin:0;font-size:19px;letter-spacing:.02em}
  .sub{color:var(--sub);font-size:12px;margin-top:2px}
  header a.printlink{font-size:12px;color:var(--accent2);text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:18px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  select,button{font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);position:relative}
  .card .name{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:8px}
  .card .voname{font-size:11px;color:var(--sub);font-weight:500}
  .badgecol{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .badge{font-size:10px;background:#f0e9dd;color:var(--sub);padding:3px 7px;border-radius:20px;cursor:default}
  .badge.custom{background:#fbeadd;color:var(--accent)}
  .badge.hard{background:#fbe4e0;color:#c1503b;cursor:pointer}
  .star{cursor:pointer;font-size:15px;color:#ddd6c8;margin-right:2px}
  .star.on{color:#e0a63f}
  svg{display:block;margin:6px auto}
  .degrees{text-align:center;font-size:12px;color:var(--sub);margin-top:6px}
  .degrees b{color:var(--ink)}
  .voicings{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .vchip{font-size:11px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
  .vchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vchip.omit{border-color:#8fbf8f;color:#3f7a3f}
  .vchip.omit.on{background:#5a9a5a;color:#fff;border-color:#5a9a5a}
  .vchip.sub{border-color:#b09fd6;color:#6a4fa8}
  .vchip.sub.on{background:#8a6fc8;color:#fff;border-color:#8a6fc8}
  .omitnote{text-align:center;font-size:11px;color:#3f7a3f;margin-top:4px}
  .omitnote.subnote{color:#6a4fa8}
  .addmemo{display:block;width:100%;margin-top:8px;font-size:11px;padding:5px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--sub);cursor:pointer}
  .addmemo:hover{border-color:var(--accent);color:var(--accent)}
  .addcard{border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:14px;min-height:230px;cursor:pointer;border-radius:16px}
  .addcard:hover{border-color:var(--accent);color:var(--accent)}
  h2.sec{margin:30px 0 4px;font-size:17px}
  h2.sec small{font-size:12px;color:var(--sub);font-weight:400}
  .progcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
  .progcard .pn{font-weight:700;font-size:16px}
  .progcard .pd{font-size:12px;color:var(--sub);margin:2px 0 8px}
  .progcard .pc{font-size:15px;letter-spacing:.02em;color:var(--accent);font-weight:600}
  .progcard .ps{font-size:11px;color:var(--sub);margin-top:8px}
  .memobox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;max-width:640px}
  .memoseq{display:flex;gap:8px;flex-wrap:wrap;min-height:36px}
  .memochip{padding:6px 12px;border-radius:20px;background:var(--bg);border:1px solid var(--line);cursor:grab;font-weight:700;font-size:13px}
  .memochip.drag{opacity:.4}
  .memoctrl{margin-top:10px;display:flex;gap:8px}
  .memoctrl button{font-size:12px;padding:5px 10px}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
  .mask.on{display:flex}
  .modal{background:var(--card);border-radius:18px;padding:20px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .modal h3{margin:0 0 4px}
  .modal .hint{font-size:12px;color:var(--sub);margin-bottom:12px}
  .editboard{display:flex;justify-content:center;margin:8px 0}
  .row{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
  .row label{width:80px;color:var(--sub)}
  .row input{flex:1;padding:7px 10px;border-radius:9px;border:1px solid var(--line);font:inherit}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  input[type=file]{display:none}
  .tabbtn{font:inherit;padding:7px 14px;border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;background:var(--bg);color:var(--sub);cursor:pointer;font-size:13px}
  .tabbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <h1>🎵 ウクレレコード帳</h1>
      <div class="sub">S&Sシニアスマイル音楽教室 / キー×種類で自動生成・自分のボイシングも登録</div>
    </div>
    <a class="printlink" href="print.html">🖨 印刷用ページへ</a>
  </div>
  <div class="tabs hrow" style="gap:6px;padding-top:8px">
    <button class="tabbtn on" id="tabbtnGenerate" onclick="switchTab('generate')">コード生成</button>
    <button class="tabbtn" id="tabbtnSearch" onclick="switchTab('search')">🔍 全コード検索</button>
  </div>
</header>
<div class="wrap" id="tabGenerate">
  <div class="controls">
    <label>キー
      <select id="key"></select>
    </label>
    <label>種類
      <select id="type">
        <option value="triad">主要三和音（I・IV・V7）</option>
        <option value="diatonic">ダイアトニック7コード</option>
        <option value="common" selected>よく使うコード（ノンダイア含む）</option>
      </select>
    </label>
    <label>調弦
      <select id="tuning">
        <option value="low" selected>Low-G（G3 C E A）</option>
        <option value="high">High-G（G4 C E A）</option>
      </select>
    </label>
    <button class="primary" onclick="openAdd()">＋ ボイシングを登録</button>
    <button onclick="exportJSON()">⭳ バックアップ書き出し</button>
    <button onclick="$('importFile').click()">⭱ 読み込み</button>
    <input type="file" id="importFile" accept="application/json">
  </div>

  <div class="grid" id="grid"></div>

  <h2 class="sec">🎼 定番コード進行集 <small>— 代表曲つき。キーは上で選んだものに自動変換</small></h2>
  <div class="grid" id="progs"></div>

  <h2 class="sec">📝 進行メモ <small>— カードの「＋メモへ」で追加、ドラッグで並べ替え</small></h2>
  <div class="memobox">
    <div class="memoseq" id="memo"></div>
    <div class="memoctrl">
      <button onclick="clearMemo()">クリア</button>
      <span style="font-size:11px;color:var(--sub);align-self:center">自動保存されます</span>
    </div>
  </div>
</div>

<div class="wrap" id="tabSearch" style="display:none">
  <div class="controls">
    <label>ルート
      <select id="searchRoot"><option value="">すべて</option></select>
    </label>
    <label>種類
      <select id="searchQuality"><option value="ALL">すべて</option></select>
    </label>
    <input type="text" id="searchText" placeholder="コード名で検索（例: F#m7）" style="padding:8px 12px;border-radius:10px;border:1px solid var(--line);min-width:200px">
    <span style="font-size:12px;color:var(--sub)" id="searchCount"></span>
  </div>
  <div class="grid" id="searchGrid"></div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3>ボイシングを登録</h3>
    <div class="hint">押さえたい場所をタップ（開放は0）。度数と推奨運指は自動判定します。</div>
    <div class="editboard" id="editboard"></div>
    <div class="row"><label>コード名</label><input id="ename" placeholder="例: Cadd9"></div>
    <div class="row"><label>呼び名</label><input id="evoname" placeholder="例: ハイポジション型"></div>
    <div class="degrees" id="edeg">度数: —</div>
    <div class="actions">
      <button onclick="closeAdd()">キャンセル</button>
      <button class="primary" onclick="saveVoicing()">保存</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const LS_CUSTOM='ukechords.custom', LS_MEMO='ukechords.memo', LS_FAV='ukechords.favorites',
      LS_KEY='ukechords.key', LS_TYPE='ukechords.type', LS_TUNING='ukechords.tuning',
      LS_HARD_OVERRIDE='ukechords.difficulty.overrides';

// ===== 音楽理論まわり =====
const OPEN_LOW=[7,0,4,9], OPEN_HIGH=[7,0,4,9]; // 押弦パターンはHigh/Lowで変わらない(表示上の最低音のみ違う)
const OPEN=()=>OPEN_LOW;

const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function spell(rootPc,pc){ return (SHARP_KEYS.has(rootPc)?SHARP:FLAT)[pc]; }

// ===== 難易度スコア（設計書§3） =====
function difficultyScore(frets, fingers){
  const fretted=frets.filter(f=>f>0);
  let score=0;
  const counts={}; fretted.forEach(f=>counts[f]=(counts[f]||0)+1);
  if(Object.values(counts).some(c=>c>=3)) score+=3; // バレー
  const span=fretted.length?Math.max(...fretted)-Math.min(...fretted):0;
  if(span>=3) score+=2; // フレットスパン
  if(fretted.length===4) score+=2; // 開放弦なし
  const minFret=fretted.length?Math.min(...fretted):0;
  if(minFret>=4) score+=2; // ハイポジション
  if(fingers && fingers.includes(4)) score+=1; // 小指使用
  return score;
}
const HARD_THRESHOLD=4;
function isHard(name, frets, fingers){
  const overrides=load(LS_HARD_OVERRIDE,{});
  if(name in overrides) return overrides[name];
  return difficultyScore(frets,fingers)>=HARD_THRESHOLD;
}
function toggleHardOverride(name, frets, fingers){
  const overrides=load(LS_HARD_OVERRIDE,{});
  const auto=difficultyScore(frets,fingers)>=HARD_THRESHOLD;
  const cur = name in overrides ? overrides[name] : auto;
  overrides[name] = !cur;
  save(LS_HARD_OVERRIDE,overrides);
}

// ===== 理論生成の省略形（設計書§2C） =====
const QUALITY_TONES_EXT={'':[0,4,7],'m':[0,3,7],'7':[0,4,7,10],'maj7':[0,4,7,11],'m7':[0,3,7,10],'dim':[0,3,6,9],'m7-5':[0,3,6,10],'aug':[0,4,8],'sus4':[0,5,7]};
// 各品質: mustKeep=省くと性格が壊れる音, omitOrder=省略してよい順（1個ずつ／可能なら2個同時も試す）
const OMIT_RULES={
  '':    {mustKeep:[4],     omitOrder:[7,0]},
  'm':   {mustKeep:[3],     omitOrder:[7,0]},
  '7':   {mustKeep:[4,10],  omitOrder:[7,0]},
  'maj7':{mustKeep:[4,11],  omitOrder:[7,0]},
  'm7':  {mustKeep:[3,10],  omitOrder:[7,0]},
  'dim': {mustKeep:[3,6],   omitOrder:[9,0]},
  'm7-5':{mustKeep:[3,6],   omitOrder:[10,0]},
  'aug': {mustKeep:[4,8],   omitOrder:[0]},
  'sus4':{mustKeep:[5],     omitOrder:[7,0]},
};
const OMIT_LABEL={0:'ルート省略',4:'3度省略',3:'m3度省略',7:'5度省略',10:'7度省略',11:'M7度省略',9:'6度省略',6:'b5度省略',8:'#5度省略',5:'4度省略'};
function playabilityScore(frets){
  const fretted=frets.filter(f=>f>0);
  const openCount=frets.filter(f=>f===0).length;
  const span=fretted.length?Math.max(...fretted)-Math.min(...fretted):0;
  const minFret=fretted.length?Math.min(...fretted):0;
  const counts={}; fretted.forEach(f=>counts[f]=(counts[f]||0)+1);
  let barrePenalty=0; Object.values(counts).forEach(c=>{if(c>=3)barrePenalty+=2;});
  const lowBonus=(fretted.length && minFret<=2)?1:0;
  return openCount*2 + (3-fretted.length) + (2-Math.min(span,2)) + lowBonus - barrePenalty;
}
function fingersFor(frets){
  const nz=frets.map((f,i)=>({f,i})).filter(o=>o.f>0).sort((a,b)=>a.f-b.f);
  const map={}; let n=0; nz.forEach(o=>{ if(!(o.f in map)){n++;map[o.f]=n;} });
  return frets.map(f=>f>0?map[f]:0);
}
function findSameShape(frets, excludeName){
  const key=frets.join(',');
  for(const [nm,sh] of Object.entries(SH_ALL)){
    if(nm===excludeName) continue;
    if(sh.f.join(',')===key) return nm;
  }
  return null;
}
const omissionCache=new Map();
function computeOmissions(rootPc, q, name){
  const cacheKey=name;
  if(omissionCache.has(cacheKey)) return omissionCache.get(cacheKey);
  const rule=OMIT_RULES[q];
  if(!rule){ omissionCache.set(cacheKey,[]); return []; }
  const fullTones=QUALITY_TONES_EXT[q].map(iv=>(rootPc+iv)%12);
  const mustKeepPcs=rule.mustKeep.map(iv=>(rootPc+iv)%12);
  const baseKey=(SH_ALL[name]?SH_ALL[name].f:[]).join(',');
  const omitSets=[...rule.omitOrder.map(iv=>[iv]), rule.omitOrder.length>1?rule.omitOrder.slice():null].filter(Boolean);
  const seen=new Set(); const candidates=[];
  omitSets.forEach(omitIvs=>{
    const omitPcs=omitIvs.map(iv=>(rootPc+iv)%12);
    const keepTones=fullTones.filter(t=>!omitPcs.includes(t));
    if(!mustKeepPcs.every(t=>keepTones.includes(t))) return;
    if(keepTones.length<2) return;
    let best=null;
    for(let g=0;g<=5;g++)for(let c=0;c<=5;c++)for(let e=0;e<=5;e++)for(let a=0;a<=5;a++){
      const frets=[g,c,e,a];
      const sounded=frets.map((f,s)=>(OPEN()[s]+f)%12);
      if(!sounded.every(pc=>keepTones.includes(pc))) continue;
      if(!keepTones.every(t=>sounded.includes(t))) continue;
      const score=playabilityScore(frets);
      if(!best || score>best.score) best={frets:frets.slice(),score};
    }
    if(!best) return;
    const key=best.frets.join(',');
    if(key===baseKey || seen.has(key)) return;
    seen.add(key);
    const fingers=fingersFor(best.frets);
    const sameAs=findSameShape(best.frets,name);
    candidates.push({
      frets:best.frets, fingers, score:best.score,
      label:(omitIvs.length>1?'省略(複数)':OMIT_LABEL[omitIvs[0]]||'省略形'),
      note:sameAs?`＝${sameAs}と同形`:'',
      sameAs,
    });
  });
  candidates.sort((a,b)=>b.score-a.score);
  const top=candidates.slice(0,3);
  omissionCache.set(cacheKey,top);
  return top;
}

// ★草案・未承認: 講師が実弾きで採否を確認するまでの叩き台。差分注記を必ず表示する。
const SUBSTITUTE_RULES=[
  {from:'',    to:'7',   note:'7th(短7度)が加わる。伴奏なら概ね代用可'},
  {from:'',    to:'maj7',note:'メジャー7thが加わる。響きが明るく変化'},
  {from:'m7-5',to:'m7',  note:'5度が半音上がる(フラット解消)。伴奏用途限定の代用'},
  {from:'sus4',to:'',    note:'保留音(4度)を3度に解決。メジャーで代用'},
  {from:'sus4',to:'m',   note:'保留音(4度)を短3度に解決。マイナーで代用'},
];
function computeSubstitutes(rootPc, q, name){
  const baseShape=SH_ALL[name]; if(!baseShape) return [];
  const baseScore=difficultyScore(baseShape.f, baseShape.g);
  const out=[];
  SUBSTITUTE_RULES.filter(r=>r.from===q).forEach(rule=>{
    const targetName=spell(7,rootPc)+rule.to; // 表示名はシャープ固定(検索タブと統一)
    const targetShape=SH_ALL[targetName]; if(!targetShape) return;
    const targetScore=difficultyScore(targetShape.f, targetShape.g);
    if(targetScore>=baseScore) return; // 代用後の方が簡単な場合のみ提案
    out.push({name:targetName, frets:targetShape.f, fingers:targetShape.g,
      label:'≒'+targetName, note:rule.note+'（草案・未承認）'});
  });
  return out;
}
const DIM_SYMMETRY_NOTE='dim7は3フレットずつ移動しても同じ構成音（対称構造）。覚えるのは1形でOK';
function lookupShape(rootPc,q){
  const nm=PRIMARY_ROOTS[rootPc]; if(!nm)return null;
  const key=nm+q; return SH[key]?{key,...SH[key]}:null;
}
function autoShape(rootPc,q){
  const tones=QUALITY_TONES[q].map(iv=>(rootPc+iv)%12);
  const frets=[0,0,0,0];
  for(let s=0;s<4;s++){
    let best=0;
    for(let f=0;f<=5;f++){ if(tones.includes((OPEN()[s]+f)%12)){best=f;break;} }
    frets[s]=best;
  }
  const nz=frets.map((f,i)=>({f,i})).filter(o=>o.f>0).sort((a,b)=>a.f-b.f);
  const fingers=[0,0,0,0]; nz.forEach((o,k)=>fingers[o.i]=k+1);
  return {f:frets,g:fingers};
}
function chordName(rootPc,q,keyRootPc){ return spell(keyRootPc==null?rootPc:keyRootPc,rootPc)+QUALITY_LABEL[q]; }
function getShape(rootPc,q){
  const cur=lookupShape(rootPc,q);
  if(cur) return {...cur, fromBook:true};
  return {...autoShape(rootPc,q), fromBook:false};
}

// ===== キー内コード生成 =====
const KEYS=[['C',0],['D',2],['E',4],['F',5],['G',7],['A',9],['Bb',10],['B',11]];
const DEG_MAP={
  'I':{off:0,q:''}, 'I7':{off:0,q:'7'},
  'ii7':{off:2,q:'m7'}, 'iii7':{off:4,q:'m7'},
  'IV':{off:5,q:''}, 'IV7':{off:5,q:'7'}, 'iv':{off:5,q:'m'},
  'V7':{off:7,q:'7'}, 'vi7':{off:9,q:'m7'}, 'bVII':{off:10,q:''},
};
function degChord(keyRootPc, sym){
  const d=DEG_MAP[sym]; const rootPc=(keyRootPc+d.off)%12;
  return {sym, rootPc, q:d.q, name: chordName(rootPc,d.q,keyRootPc)};
}
function buildKeySet(keyRootPc, cat){
  let syms;
  if(cat==='triad') syms=['I','IV','V7'];
  else if(cat==='diatonic') syms=['I','ii7','iii7','IV','V7','vi7'];
  else{ // common
    syms=['I','ii7','iii7','IV','iv','V7','vi7','bVII'];
    // セカンダリドミナント
    const sec=(targetSym)=>{ const t=DEG_MAP[targetSym]; const root=(keyRootPc+t.off+7)%12; return {sym:'V7/'+targetSym.replace('7',''), rootPc:root, q:'7', name:chordName(root,'7',keyRootPc)}; };
    return [...syms.map(s=>degChord(keyRootPc,s)), sec('ii7'), sec('V7'), sec('vi7')];
  }
  return syms.map(s=>degChord(keyRootPc,s));
}

// ===== 描画 =====
function drawChord(shape,rootPc){
  const W=200,H=150,padL=24,padR=34,padT=16,frets=4,strs=4;
  const fx=(W-padL-padR)/frets, sy=(H-padT-14)/(strs-1);
  const idx=[3,2,1,0];
  let g='',marks='',labels='';
  for(let f=0;f<=frets;f++){const x=padL+f*fx;g+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+(strs-1)*sy}" stroke="var(--line)" stroke-width="${f===0?3:1.2}"/>`}
  for(let r=0;r<strs;r++){const y=padT+r*sy;g+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1.4"/>`}
  for(let r=0;r<strs;r++){
    const s=idx[r], y=padT+r*sy, f=shape.frets[s];
    const pc=noteAt(s,f); const deg=pc==null?null:degName(rootPc,pc);
    const col=deg?(DEGCOL[deg]||'var(--sub)'):'#bbb';
    const lbl=deg?(BOOK[deg]||deg):'';
    if(f<0){ marks+=`<text x="${padL-2}" y="${y+4}" text-anchor="end" font-size="12" fill="#bbb">✕</text>`; }
    else if(f===0){ marks+=`<circle cx="${padL-9}" cy="${y}" r="5" fill="none" stroke="${col}" stroke-width="2"/>`; }
    else{
      const x=padL+(f-0.5)*fx, fg=shape.fingers[s];
      marks+=`<circle cx="${x}" cy="${y}" r="10" fill="${col}"/>`+
             `<text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">${fg||''}</text>`;
    }
    labels+=`<text x="${W-padR+6}" y="${y+4}" font-size="11" fill="${col}" font-weight="700">${lbl}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${g}${marks}${labels}</svg>`;
}
function degreeLine(shape,rootPc,keyRootPc){
  const spellCtx=keyRootPc==null?rootPc:keyRootPc;
  const parts=shape.frets.map((f,s)=>{const pc=noteAt(s,f);if(pc==null)return null;const d=degName(rootPc,pc);return `<b style="color:${DEGCOL[d]||'var(--ink)'}">${spell(spellCtx,pc)}</b>(${BOOK[d]||d})`;}).filter(Boolean);
  return parts.join(' · ');
}

function render(){
  const keyRootPc=+$('key').value, cat=$('type').value;
  let list=buildKeySet(keyRootPc,cat);
  // 重複名を除去(セカンダリドミナントがダイアトニックと被る場合など)
  const seen=new Set(); list=list.filter(c=>{if(seen.has(c.name))return false;seen.add(c.name);return true;});

  const grid=$('grid'); grid.innerHTML='';
  list.forEach(c=>{
    const base=getShape(c.rootPc,c.q);
    const custom=customVoicings[c.name]||[];
    const omissions=computeOmissions(c.rootPc,c.q,c.name).map(o=>({label:o.label,frets:o.frets,fingers:o.fingers,type:'omit',note:o.note}));
    const substitutes=computeSubstitutes(c.rootPc,c.q,c.name).map(s=>({label:s.label,frets:s.frets,fingers:s.fingers,type:'sub',note:s.note}));
    const voicings=[{label:base.fromBook?'基本':'基本(自動)', frets:base.f, fingers:base.g, type:'base'},
      ...custom.map(v=>({label:v.label,frets:v.frets,fingers:v.fingers,type:'custom'})),
      ...omissions, ...substitutes];
    let vi=0;
    const card=document.createElement('div'); card.className='card';
    function paint(){
      const v=voicings[vi];
      const isFav=favorites.includes(c.name);
      const hard=isHard(c.name, v.frets, v.fingers);
      const badgeLabel = v.type==='custom'?'マイ登録':(v.type==='omit'?'省略形':(v.type==='sub'?'別コード代用':c.sym));
      const dimNote = c.q==='dim' ? DIM_SYMMETRY_NOTE : '';
      card.innerHTML=`
        <div class="badgecol">
          <span class="badge ${v.type==='custom'?'custom':''}">${badgeLabel}</span>
          ${hard?`<span class="badge hard" data-hardtoggle="1" title="タップで「難」表示を消す">難</span>`:''}
        </div>
        <div class="name"><span class="star ${isFav?'on':''}">★</span>${c.name}<span class="voname">${c.sym} · ${v.label}</span></div>
        ${drawChord(v,c.rootPc)}
        <div class="degrees">${degreeLine(v,c.rootPc,keyRootPc)}</div>
        ${v.note?`<div class="omitnote ${v.type==='sub'?'subnote':''}">${v.note}</div>`:''}
        ${dimNote?`<div class="omitnote subnote">${dimNote}</div>`:''}
        <div class="voicings">${voicings.map((vv,k)=>`<span class="vchip ${vv.type==='omit'?'omit':''} ${vv.type==='sub'?'sub':''} ${k===vi?'on':''}" data-k="${k}">${vv.label}</span>`).join('')}</div>
        <button class="addmemo">＋ メモへ</button>
      `;
      card.querySelector('.star').onclick=()=>{ toggleFav(c.name); paint(); };
      const hardBadge=card.querySelector('[data-hardtoggle]');
      if(hardBadge) hardBadge.onclick=()=>{ toggleHardOverride(c.name, v.frets, v.fingers); paint(); };
      card.querySelectorAll('.vchip').forEach(ch=>ch.onclick=()=>{vi=+ch.dataset.k;paint();});
      card.querySelector('.addmemo').onclick=()=>{ memo.push(c.name); save(LS_MEMO,memo); renderMemo(); };
    }
    paint(); grid.appendChild(card);
  });
  const add=document.createElement('div'); add.className='addcard'; add.textContent='＋ 新しいボイシングを登録'; add.onclick=openAdd; grid.appendChild(add);
}
function toggleFav(name){
  const i=favorites.indexOf(name);
  if(i>=0) favorites.splice(i,1); else favorites.push(name);
  save(LS_FAV,favorites);
}

    d.innerHTML=`<div class="pn">${p.name}</div>
      <div class="pd">${p.degs.join('–')}</div>
      <div class="pc">${chords.join('–')}</div>
      <div class="ps">🎵 ${p.songs.join(' / ')}</div>
      <button class="addmemo" style="margin-top:10px">＋ メモへ（この進行をセット）</button>`;
    d.querySelector('.addmemo').onclick=()=>{ memo=[...chords]; save(LS_MEMO,memo); renderMemo(); };
    el.appendChild(d);
  });
}

// ===== 進行メモ（ドラッグ並べ替え） =====
let dragIdx=null;
function renderMemo(){
  const el=$('memo'); el.innerHTML='';
  memo.forEach((c,i)=>{
    const chip=document.createElement('span'); chip.className='memochip'; chip.draggable=true; chip.textContent=c;
    chip.ondragstart=()=>{dragIdx=i;chip.classList.add('drag');};
    chip.ondragend=()=>chip.classList.remove('drag');
    chip.ondragover=e=>e.preventDefault();
    chip.ondrop=()=>{ if(dragIdx===null||dragIdx===i)return; const [m]=memo.splice(dragIdx,1); memo.splice(i,0,m); save(LS_MEMO,memo); renderMemo(); };
    chip.ondblclick=()=>{ memo.splice(i,1); save(LS_MEMO,memo); renderMemo(); };
    el.appendChild(chip);
  });
}
function clearMemo(){ memo=[]; save(LS_MEMO,memo); renderMemo(); }

// ===== バックアップ =====
function exportJSON(){
  const data={customVoicings,favorites,memo,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ukulele-chords-backup.json'; a.click(); URL.revokeObjectURL(a.href);
}
$('importFile').onchange=e=>{
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(data.customVoicings){customVoicings=data.customVoicings;save(LS_CUSTOM,customVoicings);}
      if(data.favorites){favorites=data.favorites;save(LS_FAV,favorites);}
      if(data.memo){memo=data.memo;save(LS_MEMO,memo);}
      render(); renderMemo();
      alert('読み込みました');
    }catch(err){ alert('読み込みに失敗しました: '+err.message); }
  };
  reader.readAsText(file);
};

// ===== 登録モーダル =====
let edit={frets:[0,0,0,3],fingers:[0,0,0,3],root:0};
function drawEdit(){
  const W=240,H=190,padL=20,padR=40,padT=22,frets=4,strs=4;
  const fx=(W-padL-padR)/frets, sy=(H-padT-16)/(strs-1);
  const idx=[3,2,1,0];
  let svg='';
  for(let f=0;f<=frets;f++){const x=padL+f*fx;svg+=`<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT+(strs-1)*sy}" stroke="var(--line)" stroke-width="${f===0?3:1.2}"/>`}
  for(let r=0;r<strs;r++){const y=padT+r*sy;svg+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1.4"/>`}
  for(let r=0;r<strs;r++){
    const s=idx[r], y=padT+r*sy, f=edit.frets[s];
    const pc=noteAt(s,f);const deg=pc==null?null:degName(edit.root,pc);const col=deg?(DEGCOL[deg]||'var(--sub)'):'#bbb';
    for(let ff=0;ff<=frets;ff++){const x=ff===0?padL-9:padL+(ff-0.5)*fx;svg+=`<circle cx="${x}" cy="${y}" r="13" fill="transparent" style="cursor:pointer" onclick="setFret(${s},${ff})"/>`;}
    if(f===0)svg+=`<circle cx="${padL-9}" cy="${y}" r="5" fill="none" stroke="${col}" stroke-width="2"/>`;
    else{const x=padL+(f-0.5)*fx;svg+=`<circle cx="${x}" cy="${y}" r="10" fill="${col}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">${edit.fingers[s]||''}</text>`;}
    svg+=`<text x="${W-padR+6}" y="${y+4}" font-size="10" fill="${col}" font-weight="700">${deg?(BOOK[deg]||deg):''}</text>`;
  }
  $('editboard').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${svg}</svg>`;
  $('edeg').innerHTML='度数: '+degreeLine({frets:edit.frets,fingers:edit.fingers},edit.root);
}
function setFret(s,f){
  edit.frets[s]=f;
  const nz=edit.frets.map((ff,i)=>({ff,i})).filter(o=>o.ff>0).sort((a,b)=>a.ff-b.ff);
  edit.fingers=[0,0,0,0]; nz.forEach((o,k)=>edit.fingers[o.i]=k+1);
  drawEdit();
}
function openAdd(){
  $('mask').classList.add('on');
  edit={frets:[0,0,0,3],fingers:[0,0,0,3],root:+$('key').value};
  $('ename').value=''; $('evoname').value='';
  drawEdit();
}
function closeAdd(){ $('mask').classList.remove('on'); }
function saveVoicing(){
  const name=$('ename').value.trim();
  if(!name){ alert('コード名を入力してください'); return; }
  const label=$('evoname').value.trim()||'マイ';
  if(!customVoicings[name]) customVoicings[name]=[];
  customVoicings[name].push({label,frets:[...edit.frets],fingers:[...edit.fingers]});
  save(LS_CUSTOM,customVoicings);
  closeAdd(); render();
}
window.setFret=setFret;window.openAdd=openAdd;window.closeAdd=closeAdd;window.saveVoicing=saveVoicing;
window.exportJSON=exportJSON;window.clearMemo=clearMemo;window.$=$;

// ===== タブ切替・全コード検索 =====
function switchTab(tab){
  $('tabGenerate').style.display = tab==='generate' ? '' : 'none';
  $('tabSearch').style.display = tab==='search' ? '' : 'none';
  $('tabbtnGenerate').classList.toggle('on', tab==='generate');
  $('tabbtnSearch').classList.toggle('on', tab==='search');
  if(tab==='search') renderSearch();
}
ROOT_ALL.forEach(([nm,pc])=>{ const o=document.createElement('option'); o.value=nm; o.textContent=nm; $('searchRoot').appendChild(o); });
QUALITY_ALL.forEach(([q,label])=>{ const o=document.createElement('option'); o.value=q; o.textContent=`${label} (${q||'無記号'})`; $('searchQuality').appendChild(o); });
function renderSearch(){
  const rf=$('searchRoot').value, qf=$('searchQuality').value, tf=$('searchText').value.trim().toLowerCase();
  const grid=$('searchGrid'); grid.innerHTML='';
  let count=0;
  ROOT_ALL.forEach(([rootName,rootPc])=>{
    if(rf && rf!==rootName) return;
    QUALITY_ALL.forEach(([q,qLabel])=>{
      if(qf!=='ALL' && q!==qf) return;
      const name=rootName+q;
      if(tf && !name.toLowerCase().includes(tf)) return;
      const shape=SH_ALL[name]; if(!shape) return;
      count++;
      const omissions=computeOmissions(rootPc,q,name).map(o=>({label:o.label,frets:o.frets,fingers:o.fingers,type:'omit',note:o.note}));
      const substitutes=computeSubstitutes(rootPc,q,name).map(s=>({label:s.label,frets:s.frets,fingers:s.fingers,type:'sub',note:s.note}));
      const voicings=[{label:'基本', frets:shape.f, fingers:shape.g, type:'base'}, ...omissions, ...substitutes];
      let vi=0;
      const card=document.createElement('div'); card.className='card';
      card.title=qLabel;
      function paint(){
        const v=voicings[vi];
        const hard=isHard(name, v.frets, v.fingers);
        const dimNote = q==='dim' ? DIM_SYMMETRY_NOTE : '';
        card.innerHTML=`
          <div class="badgecol">
            ${v.type==='omit'?'<span class="badge">省略形</span>':(v.type==='sub'?'<span class="badge">別コード代用</span>':'')}
            ${hard?`<span class="badge hard" data-hardtoggle="1" title="タップで「難」表示を消す">難</span>`:''}
          </div>
          <div class="name">${name}<span class="voname">${QUALITY_LABEL[q]||'メジャー'}</span></div>
          ${drawChord(v,rootPc)}
          <div class="degrees">${degreeLine(v,rootPc,7)}</div>
          ${v.note?`<div class="omitnote ${v.type==='sub'?'subnote':''}">${v.note}</div>`:''}
          ${dimNote?`<div class="omitnote subnote">${dimNote}</div>`:''}
          ${voicings.length>1?`<div class="voicings">${voicings.map((vv,k)=>`<span class="vchip ${vv.type==='omit'?'omit':''} ${vv.type==='sub'?'sub':''} ${k===vi?'on':''}" data-k="${k}">${vv.label}</span>`).join('')}</div>`:''}
        `;
        const hardBadge=card.querySelector('[data-hardtoggle]');
        if(hardBadge) hardBadge.onclick=()=>{ toggleHardOverride(name, v.frets, v.fingers); paint(); };
        card.querySelectorAll('.vchip').forEach(ch=>ch.onclick=()=>{vi=+ch.dataset.k;paint();});
      }
      paint();
      grid.appendChild(card);
    });
  });
  $('searchCount').textContent = count+'件';
}
$('searchRoot').onchange=renderSearch;
$('searchQuality').onchange=renderSearch;
$('searchText').oninput=renderSearch;
window.switchTab=switchTab;

render(); renderProgs(); renderMemo();
</script>
